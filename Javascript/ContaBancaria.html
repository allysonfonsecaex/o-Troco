<script>
    // Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método.
    var saldo = 100.5; // Float (Número com ponto flutuante)
    var senha_sistema = 3589;

    var Nome = prompt('Qual é seu nome');
    alert('Olá ' + Nome + " é um prazer ter você por aqui");

    /* Função principal. */
    function inicio() {
        var escolha = parseInt(prompt('Selecione uma opção 1.) Saldo 2.) Extrato 3.) Saque 4.) Depósito 5.) Transferência 6.) Sair'));

        switch(escolha){
            case 1:
                ver_senha(ver_saldo);
                break;
            case 2:
                ver_senha(extrato);
                break;
            case 3:
                ver_senha(fazer_saque);
                break;
            case 4:
                fazer_deposito();
                break;
            case 5:
                ver_senha(fazer_transferencia);
                break;
            case 6:
                sair();
                break;
            default:
                erro();
                break;
        }
    }

    
    function ver_senha(funcao_destino) {
        var senha_informada = parseInt(prompt('Informe a senha de segurança (4 dígitos):'));
        
        if (senha_informada === 1234) {
            funcao_destino();
        } else {
            alert('Senha incorreta!   tente 1234 rs');
            inicio();
        }
    }

    /* Função principal. */
    function ver_saldo() {
        alert('Seu saldo atual é: ' + saldo.toFixed(2));
        inicio();
    }

    
    function extrato() {
        alert('--- EXTRATO BANCÁRIO ---\n- Depósito Pix: +R$ 150.00\n- Compra Supermercado: -R$ 80.00\n- Pagamento Conta: -R$ 69.50\n------------------------');
        inicio();
    }

    /* Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
    function fazer_deposito() {
        var deposito = parseFloat(prompt('Qual o valor para depósito?')); 
        // Not a Number
        if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
            alert('Por favor, informe um número:');
            fazer_deposito();
        } 
        else if (deposito <= 0) {
            alert("Operação não autorizada");
            inicio();
        } 
        else {
            saldo += deposito;
            ver_saldo();
        }
    }

    /* Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
    function fazer_saque() {
        var saque = parseFloat(prompt('Qual o valor para saque?'));
        if (isNaN(saque) || saque === '') {
            alert('Por favor, informe um número:');
            fazer_saque();
        }
        else if(saque <= 0 || saque > saldo){
            alert("Operação não autorizada")
            inicio();
        } else {
            saldo -= saque;
            ver_saldo();
        }
    }

    
    function fazer_transferencia() {
        var conta = prompt('Informe o número da conta de destino (apenas números):');
        
        if (isNaN(conta) || conta === '' || conta.trim() === '') {
            alert('Operação não autorizada');
            inicio();
            return;
        }

        var valor_transf = parseFloat(prompt('Qual o valor para transferência?'));

        if (isNaN(valor_transf) || valor_transf === '') {
            alert('Por favor, informe um número:');
            fazer_transferencia();
        }
        else if (valor_transf <= 0 || valor_transf > saldo) {
            alert('Operação não autorizada');
            inicio();
        }
        else {
            saldo -= valor_transf;
            ver_saldo();
        }
    }

    
    function erro() {
        alert('Por favor, informe um número entre 1 a 6');
        inicio();
    }

    function sair() {
        alert(Nome + ', foi um prazer ter você por aqui!');
        window.close();
    }

    inicio();
</script>
